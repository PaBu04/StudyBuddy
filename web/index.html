<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>StudyBuddy</title>
  <link rel="stylesheet" href="pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="katex/katex.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="resizeTop"></div>

  <header id="toolbar">
    <div class="side left">
      <button id="chatBtn" class="btn" title="Claude-Chat ein-/ausblenden (Strg+L)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      </button>
    </div>
    <div class="center">
      <input id="pageNum" class="field" type="text" value="1" title="Seite (Strg+G)" autocomplete="off" spellcheck="false">
      <span class="of">/</span>
      <span id="pageCount" class="count">0</span>
      <div class="sep"></div>
      <button id="zoomOut" class="btn" title="Verkleinern (Strg+−)">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <input id="zoomVal" class="field" type="text" value="100%" title="Zoom" autocomplete="off" spellcheck="false">
      <button id="zoomIn" class="btn" title="Vergrößern (Strg++)">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="sep"></div>
      <button id="fit" class="btn" title="An Seitenbreite anpassen">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1.5" y="3.5" width="15" height="11" rx="2"/>
          <path d="M4.5 9h9M6.5 7l-2 2 2 2M11.5 7l2 2-2 2"/>
        </svg>
      </button>
      <button id="single" class="btn" title="Einzelseiten-Modus (S)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.5" y="2.5" width="7" height="13" rx="1.2"/>
          <path d="M2.8 7.5L1.5 9l1.3 1.5M15.2 7.5L16.5 9l-1.3 1.5"/>
        </svg>
      </button>
    </div>
    <div class="side right">
      <button id="minBtn" class="btn win" title="Minimieren">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg>
      </button>
      <button id="maxBtn" class="btn win" title="Maximieren">
        <svg class="i-max" width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1" fill="none" stroke="currentColor"/></svg>
        <svg class="i-restore" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y="2.5" width="7" height="7" rx="1"/><path d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1"/></svg>
      </button>
      <button id="closeBtn" class="btn win close" title="Schließen">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor"/></svg>
      </button>
    </div>
  </header>

  <aside id="chat">
    <div class="chathead">
      <svg class="logo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      <span id="chatTitle">StudyBuddy</span>
      <button id="chatMenu" class="btn" title="Chat-Optionen, Sync, Modell">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/><circle cx="11" cy="7" r="1.2"/></svg>
      </button>
      <button id="chatClose" class="btn" title="Chat ausblenden (Strg+L)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11M10.5 6.5L9 8l1.5 1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="chatList"></div>
    <div class="chatfoot">
      <div id="chatSel" hidden><span class="lbl">Markierung</span><span class="t"></span><button class="btn x" title="Markierung nicht mitschicken"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button></div>
      <div class="inputwrap">
        <textarea id="chatInput" rows="1" spellcheck="true"></textarea>
        <button id="chatSend" class="btn" title="Senden (Enter)"></button>
      </div>
      <div class="chatmeta"><span id="chatCtx"></span><span id="chatStatus"></span></div>
    </div>
    <div id="chatResize" title="Breite ändern"></div>
  </aside>

  <aside id="tabbar">
    <div class="tabhead">
      <span>Tabs</span>
      <div class="actions">
        <button id="newGroup" class="btn" title="Neue Gruppe">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 7.3v4M6 9.3h4" stroke-linecap="round"/></svg>
        </button>
        <button id="newTab" class="btn" title="PDF öffnen (Strg+O)">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div id="tabList"></div>
    <div id="tabResize" title="Breite ändern"></div>
  </aside>

  <div id="ctxmenu" hidden></div>

  <div id="findbar" hidden>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6L14 14"/></svg>
    <input id="findInput" type="text" placeholder="In PDF suchen" autocomplete="off" spellcheck="false">
    <span id="findCount"></span>
    <button id="findPrev" class="btn" title="Vorheriger Treffer (Umschalt+Enter)">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 7.5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="findNext" class="btn" title="Nächster Treffer (Enter)">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="findClose" class="btn" title="Schließen (Esc)">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <main id="docs"></main>

  <div id="offline" hidden>
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18.5h10.5a4 4 0 0 0 .9-7.9 6 6 0 0 0-10.8-2.2"/><path d="M5.2 9.6A4.5 4.5 0 0 0 7 18.5"/><path d="M3 3l18 18"/>
    </svg>
    <div class="t">Datei nicht erreichbar</div>
    <div class="p" id="offlinePath"></div>
    <div class="h">Der Tab bleibt erhalten. Ist der Speicherort (z.&nbsp;B. ein Netzlaufwerk) wieder verbunden,<br>wird die PDF beim nächsten Start geöffnet – oder sofort über „Erneut prüfen“.</div>
    <button id="offlineRetry" class="primary">Erneut prüfen</button>
  </div>

  <div id="empty">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5"/></svg>
    <button id="openBtn" class="primary">PDF öffnen</button>
    <div class="hint">oder Datei ins Fenster ziehen · Strg+O</div>
  </div>

  <div id="message" hidden></div>

  <script>
    // Fehler an den Host melden (wird nur mit STUDYBUDDY_DEBUG protokolliert)
    (function () {
      var wv = window.chrome && window.chrome.webview;
      function log(m) { try { wv && wv.postMessage("log:" + m); } catch (e) {} }
      window.addEventListener("error", function (e) { log("error: " + e.message + " @ " + e.filename + ":" + e.lineno); });
      window.addEventListener("unhandledrejection", function (e) { log("rejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      window.__log = log;
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
